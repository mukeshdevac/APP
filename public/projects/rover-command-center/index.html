            $("s-dyn").innerText = `${s}%`;
            
            // XHR is faster/lighter than fetch for ESP32
            var x = new XMLHttpRequest();
            x.open("GET", `/c?t=${t}&s=${s}`, true);
            x.send();
        }

        $("mBtn").onclick = () => {
            storm = !storm;
            $("mBtn").innerText = storm ? "STORM MODE" : "NORMAL";
            $("mBtn").className = storm ? "mode-btn storm-mode" : "mode-btn";
            $("mLab").innerText = storm ? "100% UNLOCKED" : "50% LIMIT";
            send();
        };

        let sec = 0;
        setInterval(() => {
            sec++;
            let h = Math.floor(sec/3600).toString().padStart(2,'0');
            let m = Math.floor((sec%3600)/60).toString().padStart(2,'0');
            let s = (sec%60).toString().padStart(2,'0');
            $("clock").innerText = `${h}:${m}:${s}`;
        }, 1000);

        // DELAY joystick initialization to ensure base64 script executes first!
        setTimeout(() => {
            const opts = (z, c, ly, lx) => ({ zone: $(z), mode: 'static', position: {left:'50%', top:'50%'}, color: c, size: 240, lockY: ly, lockX: lx });
            const jL = nipplejs.create(opts('t-zone', '#8cf0ea', true, false));
            const jR = nipplejs.create(opts('s-zone', '#cf673e', false, true));
            
            jL.on('move', (e, d) => { tR = Math.round(d.vector.y * 100); send(); });
            jL.on('end', () => { tR = 0; send(); });
            jR.on('move', (e, d) => { sR = Math.round(d.vector.x * 100); send(); });
            jR.on('end', () => { sR = 0; send(); });
        }, 100);
    </script>
</body>
</html>
